<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Exam Suite | Web Terminal Exam Simulator (VCE & Pass4sure Style)</title>
  <meta name="description" content="Simulador de exámenes de certificación con terminal web interactiva. Soporta carga de documentos PDF, TXT, JSON y dumps de VCE/ExamTopics con control de tiempo y preguntas." />

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- CRT Scanline Effect (Togglable) -->
  <div class="scanline-overlay"></div>

  <!-- Root App Shell -->
  <div id="app">
    <!-- Top Header Bar -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-title">
          EXAM-TERMINAL <span class="brand-badge">V2.5 PRO</span>
        </div>
      </div>

      <div class="header-controls">
        <button class="btn btn-primary" id="btnNewExam">
          📂 Cargar Examen / Documento
        </button>
        <button class="btn" id="btnToggleSplit">
          🖥️ Cambiar Vista Split/Consola
        </button>
        <button class="btn" id="btnToggleCRT">
          📟 Efecto CRT Monitor
        </button>
      </div>
    </header>

    <!-- Workspace Grid -->
    <main class="workspace split-mode">
      <!-- Web Terminal CLI Column -->
      <div id="terminalContainer"></div>

      <!-- Exam Engine / GUI Results Column -->
      <div id="viewContainer"></div>
    </main>
  </div>

  <!-- Modal Portal Container -->
  <div id="modalContainer"></div>

  <!-- Main ES Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
